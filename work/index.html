<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Task Tracker</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --panel2: #fafbfc; --ink: #1b1f24; --muted: #6b7280; --faint: #9ca3af;
    --line: #e5e7eb; --hover: #f1f3f6; --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eef0ff;
    --danger: #d14343; --danger-soft: #fdecec; --warn: #b45309; --warn-soft: #fef3e2; --ok: #15803d; --ok-soft: #e7f6ec;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
    --radius: 10px; --side: 248px; --detail: 400px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a20; --panel2: #1b1f26; --ink: #e8eaed; --muted: #9aa3ad; --faint: #6b7380;
      --line: #272b33; --hover: #20242c; --accent: #8b8cf8; --accent-ink: #0f1115; --accent-soft: #24264a;
      --danger: #f07171; --danger-soft: #3a1f22; --warn: #f0b45a; --warn-soft: #3a2d17; --ok: #5fd08a; --ok-soft: #173325;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .app { display: grid; grid-template-columns: var(--side) 1fr; height: 100vh; height: 100dvh; }
  .app.with-detail { grid-template-columns: var(--side) 1fr var(--detail); }

  /* Sidebar */
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px; font-weight: 700; font-size: 15px; }
  .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 15px; }
  .navscroll { overflow-y: auto; flex: 1; padding: 4px 10px 12px; }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; text-align: left; color: var(--ink); }
  .nav:hover { background: var(--hover); }
  .nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav .ic { width: 18px; text-align: center; opacity: .85; }
  .nav .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav .cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nav .cnt.hot { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 0 7px; font-weight: 600; }
  .sect { display: flex; align-items: center; justify-content: space-between; margin: 16px 10px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .sect button { width: 22px; height: 22px; border-radius: 6px; font-size: 16px; line-height: 1; color: var(--muted); }
  .sect button:hover { background: var(--hover); color: var(--ink); }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  .av { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex: none; }
  .sidefoot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .sidefoot button { padding: 6px 8px; border-radius: 6px; }
  .sidefoot button:hover { background: var(--hover); color: var(--ink); }
  .syncdot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .syncdot.ok { background: var(--ok); } .syncdot.busy { background: var(--warn); } .syncdot.warn { background: var(--danger); }
  #syncText { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 18px 28px 10px; }
  .menu { display: none; width: 34px; height: 34px; border-radius: 8px; font-size: 18px; }
  .menu:hover { background: var(--hover); }
  .ttl { flex: 1; min-width: 0; }
  .ttl h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .ttl .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .search { width: 240px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .search:focus, .field input:focus, .field select:focus, .field textarea:focus, .quick input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--danger-soft); color: var(--danger); font-weight: 600; font-size: 13px; max-width: 320px; }
  .pill span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .pill[hidden] { display: none; }
  .scroll { overflow-y: auto; flex: 1; padding: 0 28px 80px; }
  .wrap { max-width: 920px; }
  .quick { position: relative; margin: 6px 0 14px; }
  .quick input { width: 100%; padding: 12px 14px 12px 40px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .quick .plus { position: absolute; left: 14px; top: 11px; color: var(--accent); font-size: 18px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 20px; }
  .hint code { background: var(--hover); padding: 0 5px; border-radius: 4px; font-size: 11.5px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 16px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; min-width: 120px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .stat.bad b { color: var(--danger); }
  .group { margin-bottom: 18px; }
  .gh { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px 2px; }
  .gh.bad { color: var(--danger); }
  .gh .n { font-weight: 500; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--accent-soft); }
  .chk { width: 18px; height: 18px; border-radius: 50%; border: 1.6px solid var(--faint); margin-top: 1px; flex: none; display: grid; place-items: center; color: transparent; font-size: 11px; }
  .chk:hover { border-color: var(--accent); }
  .chk.high { border-color: var(--danger); }
  .row.done .chk { background: var(--ok); border-color: var(--ok); color: #fff; }
  .row.done .t { text-decoration: line-through; color: var(--muted); }
  .rb { flex: 1; min-width: 0; }
  .t { overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .chip.bad { color: var(--danger); background: var(--danger-soft); border-color: transparent; }
  .chip.soon { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .chip.doing { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .chip.run { color: var(--danger); background: var(--danger-soft); border-color: transparent; font-weight: 600; }
  .chip .av { width: 16px; height: 16px; font-size: 8.5px; }
  .tbtn { width: 28px; height: 28px; border-radius: 7px; color: var(--muted); flex: none; font-size: 12px; opacity: 0; }
  .row:hover .tbtn, .tbtn.on { opacity: 1; }
  .tbtn:hover { background: var(--panel); color: var(--ink); }
  .tbtn.on { color: var(--danger); }
  .empty { text-align: center; color: var(--muted); padding: 48px 20px; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--panel); }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.pri:hover { filter: brightness(1.05); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 4px 9px; font-size: 12.5px; }
  .btn[disabled] { opacity: .55; cursor: default; }

  /* Inbox */
  .scanbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .scanbar .txt { flex: 1; min-width: 220px; }
  .scanbar .txt b { display: block; }
  .note { font-size: 13px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); margin-bottom: 14px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .sugg { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-start; }
  .sugg:first-child { border-top: 0; }
  .sugg .rb input { width: 100%; border: 1px solid transparent; background: transparent; padding: 3px 6px; margin: -3px -6px; border-radius: 6px; font-weight: 500; }
  .sugg .rb input:hover, .sugg .rb input:focus { border-color: var(--line); background: var(--panel2); outline: none; }
  .sugg .acts { display: flex; gap: 6px; flex: none; }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* Detail */
  .detail { background: var(--panel); border-left: 1px solid var(--line); display: none; flex-direction: column; min-height: 0; }
  .app.with-detail .detail { display: flex; }
  .dh { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .dh .x { width: 30px; height: 30px; border-radius: 7px; font-size: 16px; color: var(--muted); }
  .dh .x:hover { background: var(--hover); color: var(--ink); }
  .db { overflow-y: auto; padding: 16px 18px 40px; flex: 1; }
  .dtitle { width: 100%; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; margin: -6px -8px 10px; font-size: 18px; font-weight: 600; resize: none; background: transparent; }
  .dtitle:hover, .dtitle:focus { border-color: var(--line); outline: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .field.full { grid-column: 1 / -1; }
  .field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--panel); color: var(--ink); font-size: 13.5px; width: 100%; min-width: 0; }
  .field textarea { resize: vertical; min-height: 90px; }
  .blk { margin-top: 16px; }
  .blk > .lab { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
  .tog { display: flex; flex-wrap: wrap; gap: 6px; }
  .tog button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 4px; font-size: 12.5px; }
  .tog button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tog button.add { padding: 3px 10px; color: var(--muted); }
  .timebox { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel2); }
  .timebox .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin: 8px 0 10px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar i.over { background: var(--danger); }
  .src { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); }

  /* Modal + toast */
  .scrim { position: fixed; inset: 0; background: rgba(15,17,21,.45); display: none; z-index: 40; }
  .scrim.show { display: block; }
  .modal { position: fixed; z-index: 50; left: 50%; top: 12vh; transform: translateX(-50%); width: min(480px, calc(100vw - 24px)); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); display: none; max-height: 76vh; overflow-y: auto; }
  .modal.show { display: block; }
  .modal h2 { margin: 0; padding: 18px 20px 4px; font-size: 17px; }
  .modal .mb { padding: 10px 20px; display: flex; flex-direction: column; gap: 12px; }
  .modal .mf { padding: 12px 20px 18px; display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .modal .check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--ink); font-weight: 400; }
  .modal .check input { width: auto; margin-top: 3px; }
  .modal .help { font-size: 12px; color: var(--muted); font-weight: 400; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .swatches button { width: 24px; height: 24px; border-radius: 6px; border: 2px solid transparent; }
  .swatches button.on { border-color: var(--ink); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: #1b1f24; color: #fff; padding: 10px 14px; border-radius: 10px; display: flex; gap: 14px; align-items: center; opacity: 0; pointer-events: none; transition: .2s; z-index: 60; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .toast button { color: #a5b4fc; font-weight: 600; }

  /* Narrow screens */
  @media (max-width: 1180px) {
    .app.with-detail { grid-template-columns: var(--side) 1fr; }
    .app.with-detail .detail { position: fixed; right: 0; top: 0; bottom: 0; width: min(var(--detail), 100vw); z-index: 30; box-shadow: var(--shadow); }
  }
  @media (max-width: 820px) {
    .app, .app.with-detail { grid-template-columns: 1fr; }
    aside { position: fixed; left: 0; top: 0; bottom: 0; width: 280px; z-index: 45; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
    .app.nav-open aside { transform: none; }
    .menu { display: grid; place-items: center; }
    .top { padding: 12px 14px 6px; flex-wrap: wrap; }
    .search { width: 100%; order: 5; }
    .scroll { padding: 0 14px 90px; }
    .app.with-detail .detail { width: 100vw; }
    .tbtn { opacity: 1; }
    .grid { grid-template-columns: 1fr 1fr; }
    .sugg { flex-wrap: wrap; }
    .sugg .acts { width: 100%; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside id="side">
    <div class="brand"><div class="logo">✓</div><span>Team Tasks</span></div>
    <div class="navscroll" id="nav"></div>
    <div class="sidefoot">
      <span class="syncdot" id="syncDot"></span><span id="syncText">Loading…</span>
      <button id="btnSettings" title="Settings">⚙ Settings</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <button class="menu" id="btnMenu" aria-label="Menu">☰</button>
      <div class="ttl"><h1 id="vTitle">Today</h1><div class="sub" id="vSub"></div></div>
      <button class="pill" id="timerPill" hidden title="Stop timer">■ <span id="timerText"></span></button>
      <input class="search" id="search" type="search" placeholder="Search tasks  ( / )" autocomplete="off">
    </header>
    <div class="scroll"><div class="wrap" id="main"></div></div>
  </main>
  <section class="detail" id="detail"></section>
</div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
(function () {
  "use strict";
  var M365 = "Microsoft 365", FLOW = "Wispr Flow", LS_KEY = "team-tasks-state";
  var COLORS = ["#4f46e5", "#0ea5e9", "#10b981", "#f59e0b", "#ef4444", "#ec4899", "#8b5cf6", "#64748b", "#14b8a6", "#a16207"];
  var ESTIMATES = [0, 15, 30, 45, 60, 90, 120, 180, 240, 360, 480];

  /* ---------- State ---------- */
  function blank() {
    return {
      v: 1, nextId: 1, tasks: [], projects: [], people: [],
      inbox: { lastScanMail: null, lastScanFlow: null, items: [], seen: [], dismissed: [], note: "" },
      settings: { me: "", teamMailbox: "", includeShared: true, forTeam: true, firstDays: 7 }
    };
  }
  var state = blank();
  var view = "today", openId = null, query = "", profileName = "";
  var localMode = false, dbRef = null, writing = false, dirty = false, loaded = false, canSave = null, saveTimer = null, serverOk = false, heldSince = null, bootAt = new Date().toISOString();
  var scanning = false, scanNote = "", scanWarn = false, undoSnap = null, toastTimer = null;

  function normalize() {
    var b = blank();
    ["tasks", "projects", "people"].forEach(function (k) { if (!Array.isArray(state[k])) state[k] = []; });
    if (!state.nextId) state.nextId = 1;
    state.inbox = Object.assign(b.inbox, state.inbox || {});
    ["items", "seen", "dismissed"].forEach(function (k) { if (!Array.isArray(state.inbox[k])) state.inbox[k] = []; });
    if (state.inbox.seen.length > 4000) state.inbox.seen = state.inbox.seen.slice(-4000);
    if (state.inbox.dismissed.length > 600) state.inbox.dismissed = state.inbox.dismissed.slice(-600);
    state.settings = Object.assign(b.settings, state.settings || {});
    var pids = {}, peids = {};
    state.projects.forEach(function (p) { pids[p.id] = 1; if (!p.color) p.color = COLORS[0]; });
    state.people.forEach(function (p) { peids[p.id] = 1; });
    state.tasks.forEach(function (t) {
      if (!t.status) t.status = "todo";
      if (!t.priority) t.priority = "normal";
      if (!t.owner || (t.owner !== "me" && !peids[t.owner])) t.owner = "me";
      if (t.project && !pids[t.project]) t.project = "";
      if (t.waiting && !peids[t.waiting]) t.waiting = "";
      t.people = (t.people || []).filter(function (id) { return peids[id]; });
      if (typeof t.spent !== "number") t.spent = 0;
      if (typeof t.estimate !== "number") t.estimate = 0;
      if (!t.created) t.created = new Date().toISOString();
      if (t.status === "done" && !t.doneAt) t.doneAt = new Date().toISOString();
      if (t.status !== "done") t.doneAt = null;
    });
  }
  function newId(p) { return p + (state.nextId++); }

  /* ---------- Small helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function parseYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayDiff(s) { return Math.round((parseYmd(s) - parseYmd(today())) / 864e5); }
  function fmtTime(hm) { if (!hm) return ""; var p = hm.split(":"); var d = new Date(); d.setHours(+p[0], +p[1], 0, 0); return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  function fmtDate(s, long) {
    var dd = dayDiff(s);
    if (dd === 0) return "Today"; if (dd === 1) return "Tomorrow"; if (dd === -1) return "Yesterday";
    var d = parseYmd(s);
    if (dd > 1 && dd < 7) return d.toLocaleDateString([], { weekday: long ? "long" : "short" });
    return d.toLocaleDateString([], { month: "short", day: "numeric", year: d.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined });
  }
  function fmtMin(m) { m = Math.round(m || 0); if (!m) return "0m"; var h = Math.floor(m / 60), r = m % 60; return h ? h + "h" + (r ? " " + r + "m" : "") : r + "m"; }
  function fmtClock(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 3600) + ":" + pad(Math.floor(sec / 60) % 60) + ":" + pad(sec % 60); }
  function spentSec(t) { return (t.spent || 0) + (t.timerStart ? (Date.now() - Date.parse(t.timerStart)) / 1000 : 0); }
